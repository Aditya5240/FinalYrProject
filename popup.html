<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reply Assistant</title>
  <style>
    :root {
      --ink: #1B2A41; --graphite: #5B6472; --faint: #8A93A0; --rule: #DCE1E8; --blotter: #F2F4F7; --paper: #FFFFFF;
      --accent: #3B6BA5; --good: #2E7D5B; --bad: #9B2C2C;
      --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, Cambria, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .header { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--rule); }
    .brand { flex: 1; font-family: var(--serif); font-size: 17px; font-weight: 600; }
    .provider-pill { font-size: 12px; color: var(--graphite); cursor: pointer; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .provider-pill:hover { color: var(--ink); text-decoration: underline; }
    .icon-btn { background: none; border: none; color: var(--faint); cursor: pointer; padding: 5px; border-radius: 6px; display: flex; }
    .icon-btn:hover { background: var(--blotter); color: var(--ink); }

    .container { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }

    .btn-snip { width: 100%; height: 42px; border: none; border-radius: 9px; background: var(--ink); color: #fff; font: 500 14px inherit;
      font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    .btn-snip:hover { background: #24375A; }
    .shortcut-badge { font-size: 11.5px; color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 1px 6px; }
    .alt { margin-top: -4px; text-align: center; font-size: 12px; color: var(--faint); }
    .alt a { color: var(--accent); text-decoration: none; }
    .alt a:hover { text-decoration: underline; }

    .prefs-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--blotter);
      border-left: 2px solid var(--accent); border-radius: 0 7px 7px 0; font-size: 12.5px; color: var(--graphite); }
    .prefs-line a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .prefs-line a:hover { text-decoration: underline; }

    .input-instruction { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 8px; font: inherit; font-size: 12.5px; color: var(--ink); outline: none; }
    .input-instruction:focus { border-color: #B7C2D0; box-shadow: 0 0 0 3px rgba(59,107,165,.10); }
    .input-instruction::placeholder { color: var(--faint); }

    .error-banner { display: none; padding: 9px 12px; background: #FBEDED; color: var(--bad); border-radius: 7px; font-size: 12.5px; }
    .error-banner a { color: var(--bad); text-decoration: underline; cursor: pointer; }
    .status-card { display: none; align-items: center; gap: 10px; font: italic 14px var(--serif); color: var(--graphite); padding: 4px 2px; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-title { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
    .context-card { display: none; }
    .snippet-preview { display: flex; gap: 10px; align-items: flex-start; }
    .snippet-thumb { width: 52px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid var(--rule); flex-shrink: 0; }
    .snippet-text-preview { font-family: var(--serif); font-size: 13px; color: var(--graphite); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .reply-card { display: none; flex-direction: column; }
    .reply-text { width: 100%; min-height: 110px; padding: 12px 14px 12px 24px; border: 1px solid var(--rule); border-radius: 6px; resize: vertical; outline: none;
      font: 14.5px/1.6 var(--serif); color: var(--ink);
      background: var(--paper) linear-gradient(to right, transparent 14px, rgba(59,107,165,.22) 14px, rgba(59,107,165,.22) 15px, transparent 15px); }
    .reply-text:focus { border-color: #B7C2D0; }
    .actions-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-secondary { flex: 1; height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 13px;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-secondary:hover { border-color: #B7C2D0; }
    .btn-copy.copied { background: var(--good); border-color: var(--good); color: #fff; }

    .footer-tip { font-size: 12px; color: var(--faint); text-align: center; }
    kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; color: var(--graphite); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Reply Assistant</div>
    <span id="activeProviderBadge" class="provider-pill" title="Model in use. Click to change it in Settings">Local model</span>
    <button class="icon-btn" id="openProfileBtn" title="What I've learned about you">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>
    </button>
    <button class="icon-btn" id="clearSessionBtn" title="Clear the last reply">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
    <button class="icon-btn" id="openSettingsBtn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="container">
    <button type="button" class="btn-snip" id="snipBtn">
      <span>Pick a message to reply to</span>
      <span class="shortcut-badge">Alt+S</span>
    </button>
    <div class="alt">Image or PDF? <a href="#" id="snipImageLink">Snip an area instead</a></div>

    <div class="prefs-line" id="prefLine">
      <span id="prefLineText">Your writing preferences</span>
      <a href="#" id="prefLineLink">View</a>
    </div>

    <input type="text" id="instructionsInput" class="input-instruction" placeholder="Optional instruction, e.g. decline politely">

    <div id="errorBanner" class="error-banner"></div>

    <div id="statusCard" class="status-card">
      <div class="spinner"></div>
      <span id="statusMessage">Writing your reply…</span>
    </div>

    <div id="contextCard" class="context-card">
      <div class="section-title">Last message <span id="contextMeta"></span></div>
      <div class="snippet-preview">
        <img id="snippetThumb" class="snippet-thumb" alt="Screenshot of the message" style="display: none;">
        <div id="snippetTextPreview" class="snippet-text-preview"></div>
      </div>
    </div>

    <div id="replySection" class="reply-card">
      <div class="section-title">Last reply</div>
      <textarea id="replyText" class="reply-text" placeholder="Your reply appears here."></textarea>
      <div class="actions-row">
        <button type="button" class="btn-secondary" id="regenerateBtn" title="Write it again"><span>Write again</span></button>
        <button type="button" class="btn-secondary btn-copy" id="copyBtn"><span id="copyBtnText">Copy</span></button>
      </div>
    </div>

    <div class="footer-tip">Press <kbd>Alt+S</kbd> on any page to pick a message.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
